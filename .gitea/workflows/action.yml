name: Build and Publish Docker Images
on:
  push:
    branches:
      - main

jobs:
  docker-api:
    runs-on: cardmakerhost
    container: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      -   name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            ref: ${{ gitea.ref }}
            token: ${{ secrets.REGISTRY_TOKEN }}
      -   name: Login to registry
          uses: docker/login-action@v3
          with:
            registry: git.tristanld.fr
            username: ${{ secrets.REGISTRY_USERNAME }}
            password: ${{ secrets.REGISTRY_TOKEN }}
      -   name: Build docker image
          run: docker build -t git.tristanld.fr/${{ secrets.REGISTRY_USERNAME }}/ygo:latest .
      -   name: Push docker image
          run: docker push git.tristanld.fr/${{ secrets.REGISTRY_USERNAME }}/ygo:latest
      -   name: Remove old docker image
          run: docker container rm -f yugiohcard
      -   name: Deploy new docker image
          run: docker run --name=yugiohcard --network=traefik -d --restart=unless-stopped git.tristanld.fr/mayayoh/ygo:latest
